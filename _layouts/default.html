<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  
  <style>
    /* 1. NORMALISED RESETS & SKRIFTTYPE */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #262B40 !important;
      color: #E2E8F0 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 1.4rem !important; 
      line-height: 1.7 !important;
    }
    
    .main-content img {
      max-width: 100% !important;
      height: auto !important;
      max-height: 700px;
      display: block;
      margin: 2rem auto;
      border-radius: 8px;
      border: 1px solid #3A4260 !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      cursor: zoom-in !important;
    }
    
    .main-content img:hover {
      transform: scale(1.015);
      border-color: #64D2FF !important;
      box-shadow: 0 6px 20px rgba(100, 210, 255, 0.2);
    }

    /* 2. TOPP-BANNER */
    .page-header {
      background-color: #2C444C !important;
      background-image: none !important;
      color: #FFFFFF !important;
      padding: 5rem 6rem !important; 
      text-align: center;
    }
    .page-header h1, .project-name {
      color: #FFFFFF !important;
      margin-top: 0;
      margin-bottom: 0.1rem;
      font-size: 3.25rem !important; 
      font-weight: 700;
      line-height: 1.25;
    }
    .page-header h2, .project-tagline {
      color: #E2E8F0 !important;
      opacity: 0.8;
      margin-top: 0;
      margin-bottom: 0;
      font-weight: normal;
      font-size: 1.25rem !important; 
    }

    /* 3. HOVEDOMRÅDET  */
    .main-content {
      max-width: 100rem !important; 
      padding: 3rem 4rem !important; 
      margin: 0 auto !important;
      background-color: transparent !important;
      word-wrap: break-word;
    }

    /* 4. OVERSKRIFTER OG ELEMENTER */
    .main-content h1 { font-size: 2rem !important; }
    .main-content h2 { font-size: 1.5rem !important; }
    .main-content h3 { font-size: 1.25rem !important; }
    
    .main-content h1, .main-content h2 {
      color: #64D2FF !important;
      border-bottom: 1px solid #3A4260 !important;
      padding-bottom: 0.3em;
      margin-top: 2rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }

    .main-content h3 {
      color: #64D2FF !important;
      font-size: 1.35rem !important;
      margin-top: 1rem !important;
      margin-bottom: 0.3rem !important;
      border-bottom: none !important;
    }
    
    .main-content hr {
      height: 1px;
      background-color: #3A4260 !important;
      border: none;
      margin: 1.5rem 0 !important;
    }

    .main-content p, .main-content li {
      color: #E2E8F0 !important;
      font-size: 1.125rem !important;
    }

    /* 5. LENKER OG KODEBLOKKER */
    .main-content a {
      color: #00CEC8 !important; 
      font-weight: bold;
      text-decoration: underline;
      transition: color 0.2s ease;
    }

    .main-content a:hover {
      color: #64D2FF !important; 
      text-decoration: none;
    }

    .main-content code, .main-content pre {
      background-color: #1E2233 !important;
      border: 1px solid #3A4260 !important;
      color: #64D2FF !important;
      border-radius: 4px;
    }
    .main-content code {
      padding: 0.2em 0.4em;
      font-size: 0.9em;
    }
    .main-content pre {
      padding: 0.8rem;
      overflow-x: auto;
    }
    
    .project-meta {
      color: #8E98B7 !important;
      font-size: 0.95em;
      display: inline-block;
      margin-top: 4px;
    }
    .site-footer {
      display: none !important;
    }

    /* 6. LIGHTBOX / POP-UP OVERLAY */
    .lightbox-modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 18, 28, 0.85);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
    }

    .lightbox-content {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border: 1px solid #3A4260;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 35px;
      color: #FFFFFF;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.2s;
    }

    .lightbox-close:hover {
      color: #64D2FF;
    }

    @media screen and (max-width: 42rem) {
      .page-header {
        padding: 2rem 1rem !important;
      }
      .page-header h1, .project-name {
        font-size: 2.25rem !important;
      }
      .page-header h2, .project-tagline {
        font-size: 1rem !important;
      }
      .main-content {
        padding: 2rem 1rem !important;
      }
    }
  </style>
</head>
<body>
  <header class="page-header" role="banner">
    <h1 class="project-name">{{ page.title | default: site.title }}</h1>
    {% if page.description or site.description %}
      <h2 class="project-tagline">{{ page.description | default: site.description }}</h2>
    {% endif %}
  </header>

  <main id="content" class="main-content" role="main">
    {{ content }}
  </main>

  <!-- LIGHTBOX CONTAINER & JAVASCRIPT -->
  <div id="lightbox" class="lightbox-modal" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-content" id="lightbox-img">
  </div>

  <script>
    document.querySelectorAll('.main-content img').forEach(img => {
      img.addEventListener('click', e => {
        e.stopPropagation();
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        lightboxImg.src = img.src;
        lightbox.style.display = 'flex';
      });
    });

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
